<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#B8860B" stroke-width="3"/>
  
  <!-- Checkerboard pattern (top-left) -->
  <g id="checkerboard">
    <rect x="10" y="10" width="20" height="20" fill="#EF4444"/>
    <rect x="30" y="10" width="20" height="20" fill="white"/>
    <rect x="50" y="10" width="20" height="20" fill="#EF4444"/>
    <rect x="70" y="10" width="20" height="20" fill="white"/>
    <rect x="90" y="10" width="20" height="20" fill="#EF4444"/>
    
    <rect x="10" y="30" width="20" height="20" fill="white"/>
    <rect x="30" y="30" width="20" height="20" fill="#EF4444"/>
    <rect x="50" y="30" width="20" height="20" fill="white"/>
    <rect x="70" y="30" width="20" height="20" fill="#EF4444"/>
    <rect x="90" y="30" width="20" height="20" fill="white"/>
    
    <rect x="10" y="50" width="20" height="20" fill="#EF4444"/>
    <rect x="30" y="50" width="20" height="20" fill="white"/>
    <rect x="50" y="50" width="20" height="20" fill="#EF4444"/>
    <rect x="70" y="50" width="20" height="20" fill="white"/>
    <rect x="90" y="50" width="20" height="20" fill="#EF4444"/>
  </g>
  
  <!-- Blue semi-circle (bottom) -->
  <path d="M 100 100 L 10 100 A 90 90 0 0 0 190 100 Z" fill="#0047AB"/>
  
  <!-- White circle for "D" -->
  <circle cx="100" cy="130" r="20" fill="white" stroke="#B8860B" stroke-width="2"/>
  
  <!-- Blue "D" inside -->
  <text x="100" y="138" font-size="28" font-weight="bold" fill="#0047AB" text-anchor="middle" font-family="Arial, sans-serif">D</text>
</svg>
